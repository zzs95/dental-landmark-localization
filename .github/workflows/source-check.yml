name: Source and release checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_release.py
      - run: python refine_net/train.py --help
      - run: python coarse_stage/train.py --help
      - run: python tools/prepare_refinement_data.py --help
